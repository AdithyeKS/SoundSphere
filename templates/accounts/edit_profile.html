{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Profile | SoundSphere{% endblock %}

{% block content %}
<div class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 600px;">
    <div class="glass-panel" style="padding: 2.5rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 1.5rem;">Edit Profile Details</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-muted);">First Name</label>
                    <input type="text" name="first_name" value="{{ u_form.first_name.value|default:'' }}" style="width: 100%; padding: 0.75rem; background: var(--bg-surface-solid); border: 1px solid var(--border-color); color: #fff; border-radius: var(--radius-sm);">
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-muted);">Last Name</label>
                    <input type="text" name="last_name" value="{{ u_form.last_name.value|default:'' }}" style="width: 100%; padding: 0.75rem; background: var(--bg-surface-solid); border: 1px solid var(--border-color); color: #fff; border-radius: var(--radius-sm);">
                </div>
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.85rem; color: var(--text-muted);">Email Address</label>
                <input type="email" name="email" value="{{ u_form.email.value|default:'' }}" style="width: 100%; padding: 0.75rem; background: var(--bg-surface-solid); border: 1px solid var(--border-color); color: #fff; border-radius: var(--radius-sm);">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.85rem; color: var(--text-muted);">Phone Number</label>
                <input type="text" name="phone" value="{{ p_form.phone.value|default:'' }}" placeholder="+1 (800) 555-0199" style="width: 100%; padding: 0.75rem; background: var(--bg-surface-solid); border: 1px solid var(--border-color); color: #fff; border-radius: var(--radius-sm);">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.85rem; color: var(--text-muted);">Bio</label>
                <textarea name="bio" rows="3" style="width: 100%; padding: 0.75rem; background: var(--bg-surface-solid); border: 1px solid var(--border-color); color: #fff; border-radius: var(--radius-sm);">{{ p_form.bio.value|default:'' }}</textarea>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
                <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
